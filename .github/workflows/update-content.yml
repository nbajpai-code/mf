name: Update Mental Food Content

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  discover-content:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          
      - name: Discover new content
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python scripts/discover_content.py
          
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet mf.md; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
          
      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: 'chore: add new mental food content'
          title: '🧠 Weekly Mental Food Update'
          body: |
            ## 🆕 New Content Discovered
            
            This PR adds newly discovered high-quality technical content to the mental food collection.
            
            ### What's New
            - New technical talks from YouTube
            - Recent research papers from arXiv
            - Trending content from Hacker News
            
            ### Review Checklist
            - [ ] Content is relevant to AI/ML, software engineering, or tech leadership
            - [ ] Sources are credible and authoritative
            - [ ] No duplicate entries
            - [ ] Proper formatting and categorization
            
            ---
            *This PR was automatically generated by the Mental Food content discovery workflow.*
          branch: auto-update-content
          delete-branch: true
          labels: |
            automated
            content-update
